[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "channel_analysis"
version = "1.0.0"
description = "Unified analysis for pooled NYU/USC UMi propagation measurements at sub-THz and 6.75 GHz"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [
    { name = "Dipankar Shakya" },
    { name = "Mingjun Ying" },
    { name = "Naveed A. Abbasi" },
    { name = "Jorge Gomez-Ponce" },
    { name = "Xingchen Liu" },
    { name = "Xinquan Wang" },
    { name = "Daniel Abraham" },
    { name = "Theodore S. Rappaport" },
    { name = "Andreas F. Molisch" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
channel-run-all = "channel_analysis.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
channel_analysis = ["styles/*.mplstyle"]
